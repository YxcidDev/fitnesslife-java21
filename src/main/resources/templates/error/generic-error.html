<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Error | Fitness Life</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Work+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>

<body>

    <div class="error-wrapper">

        <div class="error-code" th:text="${status} != null ? 'ERROR ' + ${status} : 'ERROR DEL SISTEMA'">
            ERROR 500
        </div>

        <h1 class="error-title" th:text="${title} ?: 'Algo salió mal'">
            Algo salió mal
        </h1>

        <p class="error-message">
            <span th:if="${error}" th:text="${error}">
                Ocurrió un error inesperado al procesar tu solicitud.
            </span>
            <span th:unless="${error}">
                Ocurrió un error inesperado al procesar tu solicitud.
            </span>
            Por favor, inténtalo nuevamente o vuelve al inicio.
        </p>

        <ul th:if="${fieldErrors != null and !fieldErrors.isEmpty()}"
            style="text-align:left; color: var(--text-secondary); font-size: 14px; margin: 0 0 1.5rem; padding-left: 1.2rem;">
            <li th:each="fe : ${fieldErrors}" th:text="${fe.field} + ': ' + ${fe.message}"></li>
        </ul>

        <div class="error-actions">
            <a th:href="@{/}">Volver al inicio</a>
        </div>

        <div class="error-footer">
            Si el problema persiste, contacta al administrador del sistema.
            <span th:if="${traceId}">Referencia: <strong th:text="${traceId}">abc12345</strong></span>
        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de asistencias | Fitness Life</title>
    <link rel="icon" type="image/png" th:href="@{/img/icons/logo-fl.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/attendance-kiosk.css}">
</head>

<body>

<header class="kiosk-header">
    <div class="header-brand">
        <img th:src="@{/img/icons/logo-fl.png}" alt="" class="header-logo"
             onerror="this.style.display='none'">
        <span class="header-title">Fitness Life</span>
    </div>
    <div class="header-clock">
        <span id="currentTime" class="clock-time">--:--</span>
        <span id="currentDate" class="clock-date"></span>
    </div>
</header>

<main class="kiosk-main">

    <section id="stateIdle" class="state-panel state--idle state--active">
        <h2 class="idle-title">Acerca tu código QR al lector</h2>
        <span class="idle-rule"></span>
        <p class="idle-subtitle">Lo encuentras en la sección Acceso de la aplicación</p>
    </section>

    <section id="stateProcessing" class="state-panel state--processing">
        <div class="processing-spinner">
            <svg viewBox="0 0 60 60" class="spinner-svg" aria-hidden="true">
                <circle cx="30" cy="30" r="26" class="spinner-track"/>
                <circle cx="30" cy="30" r="26" class="spinner-fill"/>
            </svg>
        </div>
        <p class="processing-text">Verificando acceso…</p>
    </section>

    <section id="stateResult" class="state-panel state--result" aria-live="polite">
        <article class="result-card" id="resultCard">
            <div class="result-body">
                <div class="result-avatar">
                    <img id="resultPhoto" src="" alt="" class="result-photo">
                    <div id="resultPhotoFallback" class="result-photo-fallback"></div>
                </div>

                <div class="result-info">
                    <h2 class="result-name" id="resultName">—</h2>
                    <p class="result-plan" id="resultPlan">—</p>
                    <p class="result-status" id="resultStatus">—</p>
                    <p class="result-detail" id="resultDetail"></p>
                </div>
            </div>

            <div class="result-footer">
                <span id="resultFooterId"></span>
                <span id="resultFooterTime"></span>
            </div>
        </article>
    </section>

</main>

<input
        id="qrInput"
        type="text"
        autocomplete="off"
        aria-hidden="true"
        tabindex="-1"
        style="position:fixed;opacity:0;pointer-events:none;width:0;height:0;"
>

<div class="countdown-bar" id="countdownBar">
    <div class="countdown-fill" id="countdownFill"></div>
</div>

<p class="kiosk-message" id="kioskMessage" role="status" aria-live="polite"></p>

<script th:src="@{/js/attendance-kiosk.js}"></script>
</body>
</html>

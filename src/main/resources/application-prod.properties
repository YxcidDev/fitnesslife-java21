# Detrás del proxy de Azure App Service (TLS termina en el proxy)
server.forward-headers-strategy=framework

spring.data.mongodb.uri=${MONGODB_URI}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED}

epayco.customer-id=${EPAYCO_CUSTOMER_ID}
epayco.private-key=${EPAYCO_PRIVATE_KEY}
epayco.public-key=${EPAYCO_PUBLIC_KEY}
epayco.test-mode=${EPAYCO_TEST_MODE}
epayco.confirmation-url=${EPAYCO_CONFIRMATION_URL}
epayco.response-url=${EPAYCO_RESPONSE_URL}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.ai.openai.chat.api-key=${GROQ_API_KEY}
spring.ai.openai.embedding.api-key=${EMBEDDING_API_KEY}
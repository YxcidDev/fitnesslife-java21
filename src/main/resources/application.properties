server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.session.store-type=redis
spring.session.timeout=30m

# Tamaño de imágenes de perfil
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Correo: opciones SMTP comunes ---
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Spring AI: chat con Groq (API compatible con OpenAI) ---
# OJO: en Spring AI 1.1.x la URL base es /openai (sin /v1). La documentación de 2.x usa /openai/v1.
spring.ai.openai.chat.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# --- Spring AI: embeddings (Voyage servido por Atlas) ---
spring.ai.openai.embedding.base-url=https://ai.mongodb.com
spring.ai.openai.embedding.options.model=voyage-4-lite

# --- Reintentos acotados ---
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s
spring.ai.retry.on-http-codes=429

# --- Tiempos máximos ---
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=45s

# --- Almacén vectorial (MongoDB Atlas) ---
spring.ai.vectorstore.mongodb.collection-name=knowledgeVectors
spring.ai.vectorstore.mongodb.index-name=knowledgeVectors_vector_index
spring.ai.vectorstore.mongodb.path-name=embedding
spring.ai.vectorstore.mongodb.metadata-fields-to-filter=audience,embeddingModel
spring.ai.vectorstore.mongodb.initialize-schema=false

# --- Privacidad ---
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
spring.ai.vectorstore.observations.log-query-response=false

# --- Chatbot ---
chatbot.llm.temperature=0.2
chatbot.llm.max-completion-tokens=1500
chatbot.llm.reasoning-effort=low
chatbot.rag.min-score=0.70
chatbot.rag.dimensions=1024
chatbot.limits.max-message-length=1000
chatbot.conversation.retention-days=90
chatbot.ingestion.directory=knowledge
chatbot.ingestion.chunk-size-tokens=300
chatbot.ingestion.embedding-batch-size=8
chatbot.ingestion.min-interval-between-requests=21s
chatbot.ingestion.rate-limit-retry-wait=45s
chatbot.limits.messages-per-minute=2

spring.main.allow-bean-definition-overriding=true

# Deshabilitar modelos que FitnessLife no usa
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# Microservicio de optimización (FastAPI + PuLP/CBC)
optimizer.api.url=${OPTIMIZER_API_URL:http://localhost:8000/optimize-retention}
optimizer.api.connect-timeout-ms=3000
optimizer.api.read-timeout-ms=60000

# --- Retención: valores por defecto del modelo ---
retention.defaults.min-confidence=0
retention.defaults.expected-months=6,4,3
retention.defaults.retention-lift=0.02,0.05,0.04,0.05,0.12,0.10,0.08,0.20,0.15
retention.defaults.reminder-cost=500
retention.defaults.discount-rate=0.15
retention.defaults.class-cost=3000
retention.defaults.budget=500000
retention.defaults.max-promotions=15
retention.defaults.max-reminders=200
retention.defaults.min-high-risk-coverage=0.8

# --- Retención: envío de correos ---
retention.mail.dry-run=false
retention.mail.from=${spring.mail.username:}
retention.mail.from-name=Fitness Life
retention.mail.gym-name=Fitness Life
retention.mail.base-url=${APP_BASE_URL:http://localhost:8080}
retention.mail.reminder-path=/
retention.mail.promotion-path=/
retention.mail.class-path=/
retention.mail.batch-size=20
retention.mail.delay-between-ms=300
retention.mail.poll-ms=5000
retention.mail.max-attempts=3
retention.mail.stale-claim-minutes=10
retention.mail.promotion-valid-days=15

# Un hilo por tarea programada
spring.task.scheduling.pool.size=2

# --- Tools del chatbot ---
chatbot.tools.timezone=America/Bogota
chatbot.tools.max-calls-per-message=3
chatbot.tools.max-classes-per-call=8
chatbot.tools.max-days-ahead=14
chatbot.tools.pending-action-ttl-minutes=10
chatbot.tools.max-pending-actions=3